# Hydra balanced Python BC training config example.
# Copy to your run dir, edit paths, then run:
#   pixi run cargo run --quiet --package hydra-train --features training --bin train -- example.yaml

# Fallback single raw-MJAI root/file/archive. Required by config contract.
data_dir: path/to/mjai

# Explicit raw-MJAI dataset roots. If set, Hydra uses exactly these entries for raw-MJAI training.
# Put every dataset folder you want consumed here; do not rely on a parent bundle scan for sibling datasets.
raw_mjai_data_dirs:
  - path/to/dataset-folder-a
  - path/to/dataset-folder-b

# Run output root.
output_dir: path/to/output/hydra-bc

# Full raw-MJAI epoch is the stopping condition.
num_epochs: 1
full_epoch: true
max_train_steps: null

# Balanced ActorNet from Hydra design: 256 hidden, 12 SE-ResNet blocks, bottleneck 64 (~5.34M params).
python_model_profile: balanced
python_residual_profile: mish_se
python_variant: compile_max_autotune

# Local preferred raw-MJAI CUDA shape for balanced model.
batch_size: 3072
microbatch_size: 1024
validation_microbatch_size: 1024

device: cuda:0
bc_backend: python
python_raw_mjai_transport: pinned_pyo3

# Deterministic replay split/augmentation contract.
train_fraction: 0.9
augment: true
seed: 0
source_filters: {}

# Auto-resume output_dir/checkpoints/latest.pt when present; explicit path only for manual recovery.
resume_checkpoint: null
resume_latest: true

# Balanced observability. Larger validation reduces false plateau reads.
log_every_n_steps: 50
validate_every_n_steps: 1000
checkpoint_every_n_steps: 2500
keep_step_checkpoints: true
validation_every_n_epochs: 1
max_validation_batches: null
max_validation_samples: 65536
max_skip_logs_per_source: 32

tensorboard: true
launch_tensorboard: true
tensorboard_host: 127.0.0.1
tensorboard_port: 6006

# Detach learner, write train.pid, stdout/stderr logs, and print watch command.
background: true

# Rust/Burn loader fields retained for config contract; Python raw-MJAI uses launcher-owned stream defaults.
shard_prefetch_depth: 2

bc:
  learning_rate: 0.0002
  min_learning_rate: 0.000001
  weight_decay: 0.00001
  grad_clip_norm: 1.0
  warmup_steps: 1000

advanced_loss: null
exit_sidecar_path: null
delta_q_sidecar_path: null

validation_gates:
  enabled: false
  min_validation_samples: 1024
  max_policy_loss_regression: 0.0
  min_policy_agreement_delta: null
  fail_training_on_gate_failure: false
  require_sidecar_coverage_when_weighted: true

rl: null
