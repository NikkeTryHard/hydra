# Hydra long-run Python BC training config example.
# Copy to a run config, edit paths, then run:
#   pixi run cargo run --quiet --package hydra-train --features training --bin train -- <config.yaml>

# Fallback raw-MJAI root/file/archive. Required by config contract.
data_dir: path/to/mjai
# Optional shard cache launch: build+validate compact v3 shards, then set this manifest.
# Raw-MJAI is default; checkpoint resume skips deterministic completed games.
# bc_shards_manifest_path: path/to/bc_shards_manifest.json


# Explicit raw-MJAI dataset roots. If set, Hydra uses exactly these entries for raw-MJAI training.
# Leave commented for the single `data_dir` source above.
# raw_mjai_data_dirs:
#   - /path/to/dataset-folder-a
#   - /path/to/dataset-folder-b

# Campaign root. Python BC/RL and Rust RL artifacts are written under stages/<stage>/runs/<run_id>/.
output_dir: path/to/output/hydra-campaign
# Optional layout overrides; defaults follow BC/RL phase mapping T0-T7.
# stage: T1_ppo_control
# run_name: latest_run


# Full raw-MJAI epoch is the stopping condition.
num_epochs: 1
full_epoch: true
max_train_steps: null

# Large long-run profile: 384 hidden, 16 SE-ResNet blocks, bottleneck 96.
# 2026-05-23 raw-MJAI 800-step A/B on balanced model:
# - default conv2d_local3+mish_se: policy_nll 1.0413, ~37.0k samples/s.
# - conv2d_local3+mish_eca: policy_nll 1.0240, ~35.6k samples/s; promising low-risk candidate.
# - convnext_tile_k7+mish_se: policy_nll 0.9656, ~22.8k samples/s; strongest early candidate, much slower.
# - global_pool_bias+mish_se: compile path hit NaN; do not use until debugged.
# Keep backbone/residual production defaults unless longer equal-sample validation confirms strength.
python_model_profile: large
python_backbone_profile: conv2d_local3
python_residual_profile: mish_se
python_variant: compile_max_autotune
# A/B: fused AdamW improved throughput ~2.5%; channels_last did not help this 1x34 conv shape.
# Keep conv layout contiguous unless a future benchmark proves otherwise.
python_conv_memory_format: contiguous

# Example raw-MJAI CUDA shape for large model.
batch_size: 3072
microbatch_size: 1024
validation_microbatch_size: 1024

device: cuda:0
bc_backend: python
python_raw_mjai_transport: pinned_pyo3

# Raw-MJAI LR horizon. Uses consumed games, not steps/samples; does not cap input.
python_raw_mjai_target_games: 6000000

# Deterministic replay split/augmentation contract.
train_fraction: 0.9
augment: true
seed: 0
source_filters: {}

# Raw-MJAI resume is default-on. Checkpoint progress stores completed games; launcher skips
# that deterministic prefix before streaming new rows. `resume_latest` resolves through the
# stage latest_run marker when available; explicit checkpoints use <run_dir>/checkpoints/latest.pt.
resume_checkpoint: null
resume_latest: true

# Long-run observability. 512k validation reduces false plateau reads.
log_every_n_steps: 50
validate_every_n_steps: 1000
checkpoint_every_n_steps: 2500
keep_step_checkpoints: true
validation_every_n_epochs: 1
max_validation_batches: null
max_validation_samples: 524288
# Python raw-MJAI validation uses a fixed, non-augmented held-out window by default.
# Train `augment: true` does not apply to validation unless launcher policy changes.

max_skip_logs_per_source: 32

tensorboard: true
launch_tensorboard: true
tensorboard_host: 127.0.0.1
tensorboard_port: 6006

# Detach learner, write run-local train.pid/stdout/stderr logs, and print watch command.
background: true

# Rust/Burn loader fields retained for config contract; Python raw-MJAI uses launcher-owned stream defaults.
shard_prefetch_depth: 2

bc:
  learning_rate: 0.0002
  min_learning_rate: 0.000001
  weight_decay: 0.00001
  grad_clip_norm: 1.0
  warmup_steps: 1000
  adamw_fused: on
  adamw_foreach: auto

# EMA checkpoint averaging. On by default for raw-vs-averaged validation/export.
ema:
  enabled: true
  decay: 0.999
  start_step: 0
  update_every_steps: 1
  device: auto  # auto: CUDA train keeps FP32 EMA on CUDA; CPU train keeps CPU shadow.
advanced_loss: null
exit_sidecar_path: null
delta_q_sidecar_path: null

validation_gates:
  enabled: false
  min_validation_samples: 1024
  max_policy_loss_regression: 0.0
  min_policy_agreement_delta: null
  fail_training_on_gate_failure: false
  require_sidecar_coverage_when_weighted: true

rl: null
