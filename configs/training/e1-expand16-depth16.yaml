# E1 feed-alignment experiment (overlay of local-rtx5070.yaml; canonical untouched).
# Burst/depth alignment: expand 64->16 (fill ~110ms), loop depth 3->16 (~160ms
# cover). Promote to canonical only on flatline evidence. Isolated root:
# HYDRA2_ARTIFACT_ROOT=/home/cachybtw/dev/hydra2-artifacts-e1
run:
  id: local-rtx5070-tenhou2024-e1
  kind: supervised
  description: 'E1: expand16 + depth16 feed alignment; canonical otherwise.'
data:
  root: ${HYDRA2_DATA_ROOT}/tenhou-houou-mjai-2024
  scope: tenhou-4p-hanchan
  train_split: train
  val_split: validation
  wall_disjoint: true
  leakage_check: true
  dora_width: 5
  actor_privileged_split: true
  dataset_manifest_hash: null
  shuffle_buffer_size: 10000
  drop_last: true
  num_workers: 8
  world_size: 1
  replay_backend: rust
  decode_prefetch: 64 # src/hydra2/data/stream.py PrefetchGameStream; cover one expansion batch.
  expand_batch_games: 16 # E1: quarter the burst; fill ~110ms vs depth-16 cover ~160ms.
model:
  architecture_id: hydra2_baseline_transformer_v1
  action_count: 6792
  parameters: {}
weights:
  w_policy: 1.0
  w_placement: 0.0
  w_value: 0.0
  w_event: null
  w_belief: null
  privileged_source_hash: null
optimizer:
  id: adamw
  lr: 0.0003
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.01
scheduler:
  id: cosine
  warmup_updates: 100
  parameters: {}
runtime:
  adapter_id: plain_pytorch
  device: cuda
  precision: bf16_mixed
  compile_mode: max-autotune-no-cudagraphs
loop:
  microbatch_size: 2048
  accumulation_steps: 1
  gradient_clip_norm: 1.0
  max_updates: 2500
  checkpoint_frequency_updates: 500
  precision: bf16_mixed
  keep_last_checkpoints: null
  log_per_type_metrics: false
  fetch_prefetch_depth: 16 # E1: max validated depth; cover >= one shrunk fill.
seeds:
  data_seed: 0
  train_seed: 0
  selection_seed: 0
selection:
  N: 30
  pilot_s: 1.5
  delta: 0.5
  alpha: 0.05
  beta: 0.2
  design: fixed_n
  declared_peeks:
  - 30
  margin: 0.0
  resamples: 2000
  seed: 0
mirror:
  enabled: false
  project: hydra2-tenhou-4p
  task_name: null
  offline_dir: null
eval:
  frequency_updates: 2500
  num_batches: 10
  walls_dir: null
  microbatch_size: null
output:
  artifact_root: null
  run_id: null
rl: null
telemetry:
  mlflow_enabled: true
  verbose_enabled: true
  verbose_interval_ms: 50
  profiler_captures: 0
