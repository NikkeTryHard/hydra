# Ablation: CPU-contention discriminator (overlay of probe-recompiles.yaml).
# num_workers 8->2 shrinks decode threads AND spawn expand procs. Same seed =>
# same batches at same updates. If the ~1.2s queue/compute spikes at updates
# ~11/26/41/57/87 vanish or move, the cause is CPU-side (GIL/GC/allocator),
# not device-side (autotune would be worker-count insensitive).
# HYDRA2_ARTIFACT_ROOT=/home/cachybtw/dev/hydra2-artifacts-w2
run:
  id: local-rtx5070-tenhou2024-w2
  kind: supervised
  description: 'Ablation: 2 workers, CPU-contention discriminator.'
data:
  root: ${HYDRA2_DATA_ROOT}/tenhou-houou-mjai-2024
  scope: tenhou-4p-hanchan
  train_split: train
  val_split: validation
  wall_disjoint: true
  leakage_check: true
  dora_width: 5
  actor_privileged_split: true
  dataset_manifest_hash: null
  shuffle_buffer_size: 10000
  drop_last: true
  num_workers: 2
  world_size: 1
  replay_backend: rust
  decode_prefetch: 64 # src/hydra2/data/stream.py PrefetchGameStream; cover one expansion batch.
  expand_batch_games: 64 # src/hydra2/training/stream_train.py _fill_parallel; games per fill round.
model:
  architecture_id: hydra2_baseline_transformer_v1
  action_count: 6792
  parameters: {}
weights:
  w_policy: 1.0
  w_placement: 0.0
  w_value: 0.0
  w_event: null
  w_belief: null
  privileged_source_hash: null
optimizer:
  id: adamw
  lr: 0.0003
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.01
scheduler:
  id: cosine
  warmup_updates: 100
  parameters: {}
runtime:
  adapter_id: plain_pytorch
  device: cuda
  precision: bf16_mixed
  compile_mode: max-autotune-no-cudagraphs
loop:
  microbatch_size: 2048
  accumulation_steps: 1
  gradient_clip_norm: 1.0
  max_updates: 150
  checkpoint_frequency_updates: 500
  precision: bf16_mixed
  keep_last_checkpoints: null
  log_per_type_metrics: false
  fetch_prefetch_depth: 3 # src/hydra2/training/loop.py train; depth >= ceil(fetch_ms/compute_ms)+1.
seeds:
  data_seed: 0
  train_seed: 0
  selection_seed: 0
selection:
  N: 30
  pilot_s: 1.5
  delta: 0.5
  alpha: 0.05
  beta: 0.2
  design: fixed_n
  declared_peeks:
  - 30
  margin: 0.0
  resamples: 2000
  seed: 0
mirror:
  enabled: false
  project: hydra2-tenhou-4p
  task_name: null
  offline_dir: null
eval:
  frequency_updates: 2500
  num_batches: 10
  walls_dir: null
  microbatch_size: null
output:
  artifact_root: null
  run_id: null
rl: null
telemetry:
  mlflow_enabled: false
  verbose_enabled: true
  verbose_interval_ms: 50
  profiler_captures: 0
