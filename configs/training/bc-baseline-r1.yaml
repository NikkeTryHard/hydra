# BC baseline r1 (SOTA recipe overlay, copies the s2-2224-bc pattern):
# houou-filtered 2022-2024 corpus, 50k updates micro4xaccum8=32,
# ckpt/eval every 500, 16 decode workers.
#
# Recipe deltas over s2-2224-bc (Wave 3-B, SOTA-quoted):
# - filtered BC: houou-only root (unchanged scope/flags) — strong-human-log
#   filter is the data source, pinned via dataset_manifest_hash when set.
# - legal-only label smoothing eps 0.03 (weights.label_smoothing).
# - warmup 1000 updates = 2% of the 50k horizon + cosine to 0
#   (scheduler.final_factor 0.0, warmup_start_factor 0.01).
# - head-specific LR multipliers registry (optimizer.head_lr_mult):
#   validated here; the optimizer build consumes them in a follow-up.
# - stratified rare-action sampling 3x over kan/ron families
#   (loop.stratified_sampling + sampling_ratios, starter 2-4x).
# - per-type scorecards + val-fit temperature in every eval report.
# Gates per runbook (overlap0, quarantine warn10/fail12, loss-down/topk-up,
# resume round-trip) plus: loss finite, per-kind scorecards populated.
run:
  id: tenhou-bc-baseline-r1
  kind: supervised
  description: "BC baseline r1: houou-filtered 2022-2024, legal-only LS 0.03, warmup 2% + cosine, stratified kan/ron 3x, head LRs, per-type scorecards + temperature."

data:
  root: ${HYDRA2_DATA_ROOT}/tenhou-houou-mjai-2022-2024
  scope: tenhou-4p-hanchan
  train_split: train
  val_split: validation
  wall_disjoint: true
  leakage_check: true
  dora_width: 5
  actor_privileged_split: true
  dataset_manifest_hash: null
  shuffle_buffer_size: 10000
  drop_last: true
  num_workers: 16
  world_size: 1

model:
  architecture_id: hydra2_baseline_transformer_v1
  action_count: 6792
  parameters: {}

weights:
  w_policy: 1.0
  w_placement: 0.0
  w_value: 0.0
  w_event: null
  w_belief: null
  privileged_source_hash: null
  label_smoothing: 0.03

optimizer:
  id: adamw
  lr: 0.0003
  betas: [0.9, 0.999]
  weight_decay: 0.01
  head_lr_mult:
    policy: 1.0
    placement: 0.5
    value: 0.5

scheduler:
  id: cosine
  warmup_updates: 1000
  parameters: {}
  final_factor: 0.0
  warmup_start_factor: 0.01

runtime:
  adapter_id: plain_pytorch
  device: cuda
  precision: fp32
  compile_mode: eager

loop:
  microbatch_size: 4
  accumulation_steps: 8
  gradient_clip_norm: 1.0
  max_updates: 50000
  checkpoint_frequency_updates: 500
  precision: fp32
  keep_last_checkpoints: 20
  stratified_sampling: true
  sampling_ratios:
    daiminkan: 3.0
    ankan: 3.0
    kakan: 3.0
    ron: 3.0
  log_per_type_metrics: true
  fit_temperature: true

seeds:
  data_seed: 0
  train_seed: 0
  selection_seed: 0

selection:
  N: 30
  pilot_s: 1.5
  delta: 0.5
  alpha: 0.05
  beta: 0.2
  design: fixed_n
  declared_peeks: [30]
  margin: 0.0
  resamples: 2000
  seed: 0

mirror:
  enabled: false
  project: hydra2-tenhou-4p
  task_name: null
  offline_dir: null

eval:
  frequency_updates: 500
  num_batches: 10
  walls_dir: null
  microbatch_size: null

output:
  artifact_root: null
  run_id: null

rl: null
