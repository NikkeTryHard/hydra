# Big trunk on the RTX 5070 (12GB): same 9.91M Mortal-class trunk as
# big-pretrain-v1 (8x256x8 behind hydra2_big_transformer_v1, empty parameters
# = arch defaults), resized for local VRAM. Sizing: baseline 2.07M holds
# 8.1GB at mb2048 (measured); trunk activations scale ~8x here (2x width,
# 4x depth), so mb256 targets the same ~8GB envelope with headroom — the
# run's own reserved_mb telemetry is the gate, adjust on evidence only.
# Effective batch drops 8192 -> 2048 (mb256 x accum8); LR stays 0.0003 like
# every run so far ( deviation is explicit here; retune on loss evidence,
# never by formula). 24-root shelf, 200k updates, ckpt/1000 keep-all,
# eval/2k per-type with eval micro scaled to 256 (same trunk OOMs at 2048).
# compile_mode=eager: inductor codegen is unreliable on this trunk (device-
# assert miscompile + CantSplit on dynamic shapes at 8 heads, both observed
# 2026-09-25); eager is proven correct on all probe legs. Throughput cost
# accepted; revisit compile only on new per-shape evidence.
run:
  id: local-big-rtx5070-sat-eager-ungrouped
  kind: supervised
  description: 'Big trunk saturated locally eager (inductor bypass): 9.91M x 200k updates multi-root, mb256x8, ckpt/1000 keep-all, eval/2k per-type.'
