# S1 single-year 2024 BC baseline (runbook stage S1): full 2024 corpus,
# 10k updates micro4xaccum8=32, ckpt/eval every 500, 16 decode workers
# (runbook pin 0 deviated per multithreading order; kept constant, resume-safe).
# Own id, own spec. Gates G1 per runbook (overlap0, quarantine warn10/fail12,
# loss-down/topk-up, resume round-trip).
run:
  id: tenhou2024-eval600-r1
  kind: supervised
  description: "Eval proof: S1 config at 600 updates, eval every 300 (fresh id per relaunch rule)."

data:
  root: ${HYDRA2_DATA_ROOT}/tenhou-houou-mjai-2024
  scope: tenhou-4p-hanchan
  train_split: train
  val_split: validation
  wall_disjoint: true
  leakage_check: true
  dora_width: 5
  actor_privileged_split: true
  dataset_manifest_hash: null
  shuffle_buffer_size: 10000
  drop_last: true
  num_workers: 16
  world_size: 1

model:
  architecture_id: hydra2_baseline_transformer_v1
  action_count: 6792
  parameters: {}

weights:
  w_policy: 1.0
  w_placement: 0.0
  w_value: 0.0
  w_event: null
  w_belief: null
  privileged_source_hash: null

optimizer:
  id: adamw
  lr: 0.0003
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  id: cosine
  warmup_updates: 100
  parameters: {}

runtime:
  adapter_id: plain_pytorch
  device: cuda
  precision: fp32
  compile_mode: eager

loop:
  microbatch_size: 4
  accumulation_steps: 8
  gradient_clip_norm: 1.0
  max_updates: 600
  checkpoint_frequency_updates: 300
  precision: fp32
  keep_last_checkpoints: null

seeds:
  data_seed: 0
  train_seed: 0
  selection_seed: 0

selection:
  N: 30
  pilot_s: 1.5
  delta: 0.5
  alpha: 0.05
  beta: 0.2
  design: fixed_n
  declared_peeks: [30]
  margin: 0.0
  resamples: 2000
  seed: 0

mirror:
  enabled: false
  project: hydra2-tenhou-4p
  task_name: null
  offline_dir: null

eval:
  frequency_updates: 300
  num_batches: 10
  walls_dir: null
  microbatch_size: null

output:
  artifact_root: null
  run_id: null

rl: null
