    - ${HYDRA2_DATA_ROOT}/tenhou-houou-2022
  - - tenhou-houou-2023
    - ${HYDRA2_DATA_ROOT}/tenhou-houou-2023
  - - tenhou-houou-2024
    - ${HYDRA2_DATA_ROOT}/tenhou-houou-2024
  - - majsoul-jade-2020
    - ${HYDRA2_DATA_ROOT}/majsoul-jade-2020
  - - majsoul-jade-2021
    - ${HYDRA2_DATA_ROOT}/majsoul-jade-2021
  - - majsoul-jade-2022
    - ${HYDRA2_DATA_ROOT}/majsoul-jade-2022
  - - majsoul-jade-2023
    - ${HYDRA2_DATA_ROOT}/majsoul-jade-2023
  - - majsoul-jade-2024
    - ${HYDRA2_DATA_ROOT}/majsoul-jade-2024
  - - majsoul-throne-2020
