# Big pre-RL imitation base (Mortal-class 9.91M trunk on the 24-root shelf).
# Cloned from configs/training/overnight-rtx5070-keepall.yaml, never edited in place.
# Targets 1xA100-40GB (NOT sized for the RTX 5070): 8x256x8 transformer behind
# hydra2_big_transformer_v1 (empty parameters = arch defaults), mb2048 x accum4
# start recipe with a measured-peak gate (drop to 1024x8 only if the A100 probe
# records over 36GB reserved — never a formula). 200000 updates, ckpt/1000
# keep-all (~254MB/event measured x200 ~= 51GB worst case), eval/2000 per-type.
# Shelf renamed 2026-09-24 (`-mjai` infix dropped; contents re-verified identical).
# Warmup 2000 is ~1% of horizon. Eval microbatch stays explicit 2048.
run:
  id: local-big-pretrain-v1
  kind: supervised
  description: 'Big pre-RL base: 9.91M trunk x 200k updates multi-root, ckpt/1000 keep-all, eval/2k per-type.'
data:
  roots:
  - - tenhou-houou-2010
    - ${HYDRA2_DATA_ROOT}/tenhou-houou-2010
  - - tenhou-houou-2011
