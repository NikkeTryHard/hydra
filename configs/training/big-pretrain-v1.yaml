  scope: tenhou-4p-hanchan
  train_split: train
  val_split: validation
  wall_disjoint: true
  leakage_check: true
  dora_width: 5
  actor_privileged_split: true
  dataset_manifest_hash: null
  shuffle_buffer_size: 50000
  drop_last: true
  num_workers: 16
  world_size: 1
  replay_backend: rust
  decode_prefetch: 64
  expand_batch_games: 64
  homogeneous_buckets: true
model:
  architecture_id: hydra2_big_transformer_v1
  action_count: 6792
  parameters: {}
weights:
  w_policy: 1.0
  w_placement: 0.0
  w_value: 0.0
  w_event: null
  w_belief: null
  privileged_source_hash: null
  label_smoothing: 0.03
optimizer:
  id: adamw
  lr: 0.0003
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.01
scheduler:
  id: cosine
  warmup_updates: 2000
  parameters: {}
runtime:
  adapter_id: plain_pytorch
  device: cuda
  precision: bf16_mixed
  compile_mode: max-autotune-no-cudagraphs
loop:
  microbatch_size: 2048
  accumulation_steps: 4
  gradient_clip_norm: 1.0
  max_updates: 200000
  checkpoint_frequency_updates: 1000
  precision: bf16_mixed
  keep_last_checkpoints: null
  log_per_type_metrics: true
  fetch_prefetch_depth: 10
  pack_histories: false
seeds:
  data_seed: 0
  train_seed: 0
  selection_seed: 0
selection:
  N: 30
  pilot_s: 1.5
  delta: 0.5
  alpha: 0.05
  beta: 0.2
  design: fixed_n
  declared_peeks:
  - 30
  margin: 0.0
  resamples: 2000
  seed: 0
mirror:
  enabled: false
  project: hydra2-tenhou-4p
  task_name: null
  offline_dir: null
eval:
  frequency_updates: 2000
  num_batches: 10
  walls_dir: null
  microbatch_size: 2048
output:
  artifact_root: null
  run_id: null
rl: null
telemetry:
  mlflow_enabled: true
  verbose_enabled: true
  verbose_interval_ms: 50
  profiler_captures: 1
