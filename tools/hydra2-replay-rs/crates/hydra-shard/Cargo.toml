[package]
name = "hydra-shard"
version = "0.1.0"
edition = "2024"

[dependencies]
hydra-feed = { path = "../hydra-feed" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
memmap2 = "0.9"
parquet = "=59.3.0"

[dev-dependencies]
clap = { version = "4.0", features = ["derive"] }
zstd = "0.14"
flate2 = "1.1"
