[package]
name = "hydra2-replay-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
hydra-feed = { path = "../hydra-feed" }
hydra-shard = { path = "../hydra-shard" }
hydra-search = { path = "../hydra-search" }
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }
arrow-array = { version = "=59.3.0", features = ["ffi"] }
arrow-schema = { version = "=59.3.0", features = ["ffi"] }

[lib]
name = "hydra2_replay_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
