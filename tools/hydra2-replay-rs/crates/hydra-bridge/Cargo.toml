[package]
name = "hydra2-replay-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
hydra-feed = { path = "../hydra-feed" }
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }

[lib]
name = "hydra2_replay_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
