[workspace]
members = ["crates/hydra-feed", "crates/hydra-shard", "crates/hydra-bridge"]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
# NOTE: per-package `panic` overrides are rejected by cargo
# (`panic` may not be specified in a `package` profile), so the
# feed/shard-abort + bridge-unwind split is inexpressible: release stays
# all-unwind, which preserves the safety-critical half (bridge unwinding
# into stream_py_err instead of aborting the interpreter).
[profile.bench]
inherits = "release"
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
