[package]
name = "mjai-dataset-packager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.16"
fs2 = "0.4.3"
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
indicatif = "0.18.6"
rayon = "1.12.0"
tar = "0.4.46"
walkdir = "2.5.0"
zstd-safe = "7.2.4"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
