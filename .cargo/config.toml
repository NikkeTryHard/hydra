# Project build defaults: compile for this machine.
#
# These target flags apply to every Cargo invocation in this project, whether
# run through pixi or directly, as long as RUSTFLAGS is not set in the
# environment. The pixi tasks leave it unset so this file stays authoritative.
# sccache wraps rustc; clang and mold handle the link.
[build]
rustc-wrapper = "sccache"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "target-cpu=native",
    "-C", "link-arg=-fuse-ld=mold",
]
