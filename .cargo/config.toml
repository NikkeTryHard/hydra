# Project build defaults.
#
# The user-level Cargo config on this machine sets target-cpu=native. Cargo
# merges target rustflags from parent config directories, so append the
# baseline last: rustc uses the final target-cpu flag. Direct project builds
# therefore stay portable while still using clang + mold.
#
# The native release task replaces these rustflags with an explicit
# RUSTFLAGS value so only that target uses target-cpu=native.
[build]
rustc-wrapper = "sccache"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "target-cpu=x86-64",
]
