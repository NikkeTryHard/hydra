[workspace]
resolver = "2"
members = ["crates/hydra-core", "crates/hydra-engine", "crates/hydra-train"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.coverage]
inherits = "test"
opt-level = 1
codegen-units = 16
incremental = false
debug = 1

[profile.bench]
inherits = "release"
