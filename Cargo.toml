[workspace]
resolver = "2"
members = [
    "crates/hydra-core",
    "crates/hydra-data-core",
    "crates/hydra-replay-sidecar",
    "crates/hydra-sample-cache",
    "crates/hydra-replay-loader",
    "crates/hydra-bc-shards",
    "crates/hydra-belief-search",
    "crates/hydra-engine",
    "crates/hydra-encoder",
    "crates/hydra-runtime-types",
    "crates/hydra-safety",
    "crates/hydra-train",
]

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
manual_assert = "deny"
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"
blanket_clippy_restriction_lints = "allow"

[profile.dev]
debug = 1
incremental = true
codegen-units = 256

[profile.test]
inherits = "dev"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.coverage]
inherits = "test"
opt-level = 1
codegen-units = 16
incremental = false
debug = 1

[profile.bench]
inherits = "release"
