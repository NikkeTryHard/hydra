[workspace]
resolver = "2"
members = [
    "crates/hydra-core",
    "crates/hydra-data-core",
    "crates/hydra-replay-sidecar",
    "crates/hydra-sample-cache",
    "crates/hydra-replay-loader",
    "crates/hydra-bc-shards",
    "crates/hydra-belief-search",
    "crates/hydra-engine",
    "crates/hydra-encoder",
    "crates/hydra-runtime-types",
    "crates/hydra-safety",
    "crates/hydra-train-algo",
    "crates/hydra-model",
    "crates/hydra-train-types",
    "crates/hydra-selfplay",
    "crates/hydra-search-labels",
    "crates/hydra-train-runtime",
    "crates/hydra-train-exec",
    "crates/hydra-train",
]

[patch.crates-io]
burn = { path = "third_party/burn/burn-0.21.0" }
burn-autodiff = { path = "third_party/burn/burn-autodiff-0.21.0" }
burn-backend = { path = "third_party/burn/burn-backend-0.21.0" }
burn-tch = { path = "third_party/burn/burn-tch-0.21.0" }
burn-flex = { path = "third_party/burn/burn-flex-0.21.0" }
burn-ndarray = { path = "third_party/burn/burn-ndarray-0.21.0" }
burn-optim = { path = "third_party/burn/burn-optim-0.21.0" }
burn-cubecl = { path = "third_party/burn/burn-cubecl-0.21.0" }
burn-cubecl-fusion = { path = "third_party/burn/burn-cubecl-fusion-0.21.0" }
burn-cuda = { path = "third_party/burn/burn-cuda-0.21.0" }
burn-fusion = { path = "third_party/burn/burn-fusion-0.21.0" }
burn-ir = { path = "third_party/burn/burn-ir-0.21.0" }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
manual_assert = "deny"
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"
blanket_clippy_restriction_lints = "allow"

[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = false

[profile.prod]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
