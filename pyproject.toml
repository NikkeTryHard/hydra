[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydra-learner"
version = "0.0.0"
description = "PyTorch BC learner lane for Hydra."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "pyrefly>=1,<2",
    "pytest>=8,<9",
    "ruff>=0.11,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["python/hydra_learner/hydra_learner"]

[tool.pixi.workspace]
name = "hydra"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.49"

[tool.pixi.dependencies]
python = ">=3.12,<3.13"

[tool.pixi.feature.dev.dependencies]
rust = ">=1.95,<1.96"
cargo-nextest = ">=0.9.133,<0.10"
clang = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
protobuf = "*"
git = "*"
zstd = "*"
mold = "*"
sccache = ">=0.15.0,<0.16"

[tool.pixi.pypi-dependencies]
hydra-learner = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
numpy = "==1.26.4"
torch = "==2.9.0"
tensorboard = ">=2.20,<3"

[tool.pixi.feature.py-train.pypi-options]
index-url = "https://download.pytorch.org/whl/cu128"
extra-index-urls = ["https://pypi.org/simple"]
index-strategy = "unsafe-best-match"

[tool.pixi.feature.py-train.dependencies]
python = ">=3.12,<3.13"

[tool.pixi.feature.py-train.pypi-dependencies]
hydra-learner = { path = ".", editable = true }
hatchling = ">=1.27,<2"
numpy = "==1.26.4"
pyrefly = ">=1,<2"
pytest = ">=8,<9"
ruff = ">=0.11,<0.14"
torch = "==2.11.0+cu128"
tensorboard = ">=2.20,<3"

[tool.pixi.feature.py-train-torch212-cu126.pypi-options]
index-url = "https://download.pytorch.org/whl/cu126"
extra-index-urls = ["https://pypi.org/simple"]
index-strategy = "unsafe-best-match"

[tool.pixi.feature.py-train-torch212-cu126.dependencies]
python = ">=3.12,<3.13"

[tool.pixi.feature.py-train-torch212-cu126.pypi-dependencies]
hydra-learner = { path = ".", editable = true }
hatchling = ">=1.27,<2"
numpy = "==1.26.4"
pyrefly = ">=1,<2"
pytest = ">=8,<9"
ruff = ">=0.11,<0.14"
torch = "==2.12.0+cu126"
tensorboard = ">=2.20,<3"
torchvision = "==0.27.0+cu126"

[tool.pixi.feature.py-train-torch212-nightly-cu128.pypi-options]
index-url = "https://download.pytorch.org/whl/nightly/cu128"
extra-index-urls = ["https://pypi.org/simple"]
index-strategy = "unsafe-best-match"

[tool.pixi.feature.py-train-torch212-nightly-cu128.dependencies]
python = ">=3.12,<3.13"

[tool.pixi.feature.py-train-torch212-nightly-cu128.pypi-dependencies]
hydra-learner = { path = ".", editable = true }
hatchling = ">=1.27,<2"
numpy = "==1.26.4"
pyrefly = ">=1,<2"
pytest = ">=8,<9"
ruff = ">=0.11,<0.14"
torch = "==2.12.0.dev20260329+cu128"
tensorboard = ">=2.20,<3"
torchvision = "==0.26.0.dev20260329+cu128"


[tool.pixi.activation]
env = { LIBTORCH_USE_PYTORCH = "1", PROTOC = "$CONDA_PREFIX/lib/python3.12/site-packages/torch/bin/protoc", LD_LIBRARY_PATH = "$CONDA_PREFIX/lib/python3.12/site-packages/torch/lib:$CONDA_PREFIX/lib:$LD_LIBRARY_PATH", CUDA_HOME = "$CONDA_PREFIX", CUDA_PATH = "/opt/cuda", RUSTC_WRAPPER = "$PIXI_PROJECT_ROOT/scripts/rustc-wrapper.sh", SCCACHE_DIR = "$PIXI_PROJECT_ROOT/.pixi/sccache" }

[tool.pixi.target.linux-64.activation.env]
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "$CONDA_PREFIX/bin/clang"
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-C link-arg=-fuse-ld=$CONDA_PREFIX/bin/mold -C link-arg=$CONDA_PREFIX/x86_64-conda-linux-gnu/sysroot/usr/lib64/libc_nonshared.a"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
py-train = { features = ["py-train"], solve-group = "py-train", no-default-feature = true }
py-train-torch212-cu126 = { features = ["py-train-torch212-cu126"], solve-group = "py-train-torch212-cu126", no-default-feature = true }
py-train-torch212-nightly-cu128 = { features = ["py-train-torch212-nightly-cu128"], solve-group = "py-train-torch212-nightly-cu128", no-default-feature = true }

[tool.pixi.tasks]
fmt = [{ task = "fmt-rust" }, { task = "fmt-python" }]
fmt-check = [{ task = "fmt-rust-check" }, { task = "fmt-python-check" }]
check = { cmd = "cargo check --workspace --all-targets --no-default-features --quiet", description = "Default no-heavy Rust check" }
check-lib = { cmd = "cargo check --workspace --lib --no-default-features --quiet", description = "Fast Rust lib check" }
build = { cmd = "cargo build --workspace --no-default-features --quiet", description = "Fast default Rust build" }
build-release = { cmd = "cargo build --workspace --no-default-features --release --quiet", description = "Release Rust build" }
build-fast = { depends-on = ["build-release"], description = "Compatibility alias for release Rust build" }
test = [{ task = "test-rust" }, { task = "test-python" }]
test-lib = { cmd = "scripts/nextest-quiet.sh run --workspace --lib --no-default-features --cargo-profile dev --cargo-quiet --no-fail-fast", description = "Fast Rust lib tests" }
test-fast = { cmd = "scripts/nextest-quiet.sh run --workspace --tests --no-default-features --cargo-profile dev --cargo-quiet --no-fail-fast", description = "Rust integration tests, no benches/examples" }
test-exhaustive = { cmd = "scripts/nextest-quiet.sh run --workspace --all-targets --all-features --cargo-profile dev --cargo-quiet --no-fail-fast", description = "All-feature Rust tests" }
nextest = { depends-on = ["test-rust"], description = "Compatibility alias for Rust tests" }
lint = [{ task = "lint-rust" }, { task = "lint-python" }, { task = "typecheck-python" }]
lint-exhaustive = { cmd = "scripts/lint-check.sh --exhaustive", description = "All-feature/CUDA Rust lint plus Python gate" }
lint-cuda-graph = { cmd = "scripts/lint-check.sh --cuda-graph", description = "CUDA graph Rust lint plus Python gate" }
quality = [{ task = "fmt-check" }, { task = "lint" }, { task = "test" }]
bench-core = { cmd = "cargo bench -p hydra-core --no-default-features --features benchmarks", description = "Run hydra-core benches" }
bench-engine = { cmd = "cargo bench -p hydra-engine --no-default-features --features benchmarks", description = "Run hydra-engine benches" }
bench-train = { cmd = "cargo bench -p hydra-train --no-default-features --features training", description = "Run hydra-train benches" }
check-training = { cmd = "cargo check -p hydra-train --no-default-features --features training --bin train --quiet", description = "Check training CLI" }
check-data-tools = { cmd = "cargo check -p hydra-train --no-default-features --features data-tools --bin build_parsed_sample_cache --quiet", description = "Check data-tools CLI" }
check-cuda-graph = { cmd = "cargo check -p hydra-train --no-default-features --features cuda-graph --bin train --quiet", description = "Check CUDA graph train CLI" }
train-cuda-shards = { cmd = "cargo run --release -p hydra-train --bin train --no-default-features --features cuda-graph --", description = "Run CUDA BC shard training; pass config path after --" }
clean = { cmd = "cargo clean", description = "Delete Cargo build artifacts" }
fmt-rust = { cmd = "cargo fmt --all", description = "Format Rust workspace" }
fmt-rust-check = { cmd = "cargo fmt --all -- --check", description = "Check Rust formatting" }
fmt-python = { cmd = "ruff format python scripts/hydra_pytorch_oracle.py", description = "Format Python learner code" }
fmt-python-check = { cmd = "ruff format --check python scripts/hydra_pytorch_oracle.py", description = "Check Python formatting" }
lint-rust = { cmd = "scripts/lint-check.sh --fast --rust-only", description = "Fast Rust lint" }
lint-python = { cmd = "ruff check python scripts/hydra_pytorch_oracle.py", description = "Lint Python learner code" }
lint-python-fix = { cmd = "ruff check --fix python scripts/hydra_pytorch_oracle.py", description = "Auto-fix Python lint" }
typecheck-python = { cmd = "pyrefly check", description = "Type-check Python learner code" }
test-rust = { cmd = "scripts/nextest-quiet.sh run --workspace --all-targets --no-default-features --cargo-profile dev --cargo-quiet --no-fail-fast", description = "Default no-heavy Rust tests" }
test-python = { cmd = "scripts/pytest-quiet.sh python/hydra_learner", description = "Run Python learner tests" }
test-python-cuda = { cmd = "scripts/pytest-quiet.sh python/hydra_learner -m 'cuda or compile'", description = "Run Python CUDA/compile tests" }
python-bc-train = { cmd = "pixi run -e py-train python scripts/hydra_pytorch_oracle.py", description = "Run stable Python BC learner; pass args after --" }
python-bc-train-cu126 = { cmd = "pixi run -e py-train-torch212-cu126 python scripts/hydra_pytorch_oracle.py", description = "Run Torch 2.12 cu126 probe; pass args after --" }
python-bc-train-nightly = { cmd = "pixi run -e py-train-torch212-nightly-cu128 python scripts/hydra_pytorch_oracle.py", description = "Run Torch 2.12 nightly cu128 probe; pass args after --" }
torch-check = { cmd = "python -c \"import torch, os; print(torch.__version__); print(torch.cuda.is_available()); print(os.path.join(os.path.dirname(torch.__file__), 'lib'))\"", description = "Print default-env PyTorch info" }
torch-check-cu126 = { cmd = "pixi run -e py-train-torch212-cu126 python -c \"import torch, torchvision; print(torch.__version__); print(torch.version.cuda); print(torchvision.__version__); print(torch.cuda.is_available())\"", description = "Print Torch 2.12 cu126 probe info" }
torch-check-nightly = { cmd = "pixi run -e py-train-torch212-nightly-cu128 python -c \"import torch, torchvision; print(torch.__version__); print(torch.version.cuda); print(torchvision.__version__); print(torch.cuda.is_available())\"", description = "Print Torch 2.12 nightly cu128 probe info" }

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["python/hydra_learner", "scripts"]
extend-exclude = ["third_party", "target", "output", "Mortal-Policy", "scripts/generate_*.py"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "E",
    "F",
    "FA",
    "I",
    "N",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "PTH",
    "PYI",
    "RET",
    "RUF",
    "SIM",
    "T10",
    "T20",
    "TC",
    "UP",
    "W",
]
ignore = [
    "ANN401",
    "B010",
    "BLE001",
    "E402",
    "B023",
    "T201",
    "TC003",
    "TC006",
    "FBT001",
    "FBT002",
    "N812",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "PLR0402",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]

[tool.pyrefly]
project-includes = ["python/hydra_learner", "scripts/hydra_pytorch_oracle.py"]
project-excludes = ["scripts/generate_*.py"]
search-path = ["python/hydra_learner"]
python-version = "3.12"
python-platform = "linux"
preset = "strict"
check-unannotated-defs = true
infer-return-types = "checked"
min-severity = "warn"
tensor-shapes = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--color=yes",
]
filterwarnings = ["error"]
pythonpath = ["python/hydra_learner"]
xfail_strict = true
markers = [
    "cuda: requires CUDA-capable PyTorch runtime",
    "compile: exercises torch.compile path",
]
