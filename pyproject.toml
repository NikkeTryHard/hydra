[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "hydra3"
version = "0.1.0"
description = "Four-player Riichi policy learning with tile-edit Transformers"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = ["torch>=2.15,<2.16", "numpy>=2.5.5,<2.6"]

[project.scripts]
hydra3 = "hydra3.cli:main"

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "python"
module-name = "hydra3._arena"
bindings = "pyo3"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.84.2"

[tool.pixi.dependencies]
python = "==3.15.2"
libpython = "==3.15.2"

[tool.pixi.pypi-dependencies]
torch = "==2.15.0"
numpy = "==2.5.5"
maturin = "==1.16.0"
pytest = "==9.2.0"
pytest-xdist = "==3.8.0"
ruff = "==0.17.6"
pip = "==26.3"
pyrefly = "==1.5.0"
jax = { version = "==0.11.1", extras = ["cuda13"] }
jaxlib = "==0.11.1"
mahjax = { git = "https://github.com/nissymori/mahjax.git", rev = "d4ca79a49676232f48d275d746d7b26dc50a534d" }
svgwrite = "==1.4.3"
typing-extensions = ">=4.16,<5"

[tool.pixi.tasks]
prepare-rules = "sh scripts/prepare-rules.sh"
build = { cmd = "maturin develop --release --locked --manifest-path native/Cargo.toml", depends-on = ["prepare-rules"] }
build-debug = { cmd = "maturin develop --locked --manifest-path native/Cargo.toml", depends-on = ["prepare-rules"] }
build-native = { cmd = "maturin develop --profile release-native --locked --manifest-path native/Cargo.toml", depends-on = ["prepare-rules"] }
agent = { cmd = "python -m hydra3", env = { PYTHONPATH = "python", XLA_PYTHON_CLIENT_PREALLOCATE = "false" } }
test-cpu = { cmd = "python -m pytest -q -n 4 --dist loadscope -m \"not gpu\"", depends-on = ["build"], env = { XLA_PYTHON_CLIENT_PREALLOCATE = "false", JAX_COMPILATION_CACHE_DIR = ".pixi/jax-cache", JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS = "0", TORCHINDUCTOR_CACHE_DIR = ".pixi/torchinductor-cache" } }
test-gpu = { cmd = "python -m pytest -q -m \"gpu\"", depends-on = ["build"], env = { XLA_PYTHON_CLIENT_PREALLOCATE = "false", JAX_COMPILATION_CACHE_DIR = ".pixi/jax-cache", JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS = "0", TORCHINDUCTOR_CACHE_DIR = ".pixi/torchinductor-cache" } }
test = { cmd = "python -m pytest -q -n 4 --dist loadscope -m \"not gpu\" && python -m pytest -q -m \"gpu\"", depends-on = ["build"], env = { XLA_PYTHON_CLIENT_PREALLOCATE = "false", JAX_COMPILATION_CACHE_DIR = ".pixi/jax-cache", JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS = "0", TORCHINDUCTOR_CACHE_DIR = ".pixi/torchinductor-cache" } }
test-native = { cmd = "cargo nextest run --manifest-path native/Cargo.toml --workspace --locked --release", depends-on = ["prepare-rules"], env = { PYO3_PYTHON = "$CONDA_PREFIX/bin/python", LD_LIBRARY_PATH = "$CONDA_PREFIX/lib" } }
typecheck = "pyrefly check python tests"
lsp = "pyrefly lsp"
lint = "ruff check python tests"
format-check = "ruff format --check python tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs the CUDA device; runs in one serial process so compile and memory do not overlap",
]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyrefly]
project-includes = ["python", "tests"]
python-version = "3.15"
search-path = ["python"]
python-interpreter = ".pixi/envs/default/bin/python"
site-package-path = [".pixi/envs/default/lib/python3.15/site-packages"]
