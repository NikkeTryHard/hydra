[package]
name = "hydra-train-types"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Hydra training scalar coordination types"
repository = "https://github.com/hydra-mahjong/hydra"

[lints]
workspace = true

[dependencies]
hydra-core = { path = "../hydra-core" }
burn = { version = "0.21", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
burn = { version = "0.21", default-features = false, features = ["std", "ndarray"] }

[features]
default = []
