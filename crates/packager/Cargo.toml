[package]
name = "mjai-dataset-packager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.17"
fs2 = "0.4.3"
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
indicatif = "0.18.6"
rayon = "1.12.0"
tar = "0.4.46"
walkdir = "2.5.0"
zstd-safe = "8.0.0"
zstd = "0.14"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[workspace.lints.clippy]
# Tailored: separate workspace (not in ../Cargo.toml members) and a CLI
# binary with panic=abort — prints and infallible expect() are its interface,
# so they warn/allow instead of deny. Libs stay strict in ../Cargo.toml.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
print_stdout = "allow"
print_stderr = "allow"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
cast_possible_wrap = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
redundant_pub_crate = "allow"
multiple_crate_versions = "allow"

[lints]
workspace = true
