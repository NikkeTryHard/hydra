[package]
name = "hydra-core"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "Hydra Riichi Mahjong game engine - simulator, encoder, and batch runner"
repository = "https://github.com/hydra-mahjong/hydra"


[lints]
workspace = true
[lib]
crate-type = ["rlib"]

[dependencies]
# Game engine foundation (Apache-2.0)
riichienv-core = { path = "../hydra-engine", package = "hydra-engine" }
hydra-runtime-types = { path = "../hydra-runtime-types" }
hydra-safety = { path = "../hydra-safety" }
hydra-encoder = { path = "../hydra-encoder" }
hydra-belief-search = { path = "../hydra-belief-search" }

# Spec'd dependencies from INFRASTRUCTURE.md
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
rand_chacha = "0.9"
sha2 = "0.10"
anyhow = "1.0"
thiserror = "2.0"
dashmap = "6.1.0"
smallvec = "1.15.1"

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[example]]
name = "ppo_smoke_fixture"
path = "examples/ppo_smoke_fixture.rs"

[[bench]]
name = "simulator_bench"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "ct_smc_bench"
harness = false
required-features = ["benchmarks"]

[features]
default = []
benchmarks = []
