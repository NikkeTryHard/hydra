[package]
name = "hydra-train-runtime"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Hydra training runtime CLI, config, preflight, and probe contracts"
repository = "https://github.com/hydra-mahjong/hydra"

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
hydra-model = { path = "../hydra-model" }
hydra-data-core = { path = "../hydra-data-core" }
hydra-train-types = { path = "../hydra-train-types" }
hydra-train-algo = { path = "../hydra-train-algo" }
burn = { version = "0.20", features = ["train", "tch"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
rayon = "1.10"
libloading = "0.8"
tch = "0.22"

[features]
test-nvtx-recorder = []

[dev-dependencies]

[build-dependencies]
cc = "1"
