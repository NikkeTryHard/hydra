[package]
edition = "2021"
name = "hydra-engine"
version = "0.4.7"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Japanese Mahjong (Riichi) game engine with MJAI protocol support"
readme = "README.md"
keywords = ["mahjong", "riichi", "mjai", "game-engine"]
categories = ["game-engines", "simulation"]
license = "Apache-2.0"
repository = "https://github.com/smly/RiichiEnv"


[lints]
workspace = true
[lib]
name = "riichienv_core"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
ahash = "0.8"
base64 = "0.22"
flate2 = "1.0"
hex = "0.4"
ndarray = "0.17"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sonic-rs = { version = "0.5", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "agari_bench"
harness = false

[features]
default = ["mjai-logging"]
mjai-logging = []
## Use sonic-rs SIMD JSON parser for replay ingest (offline batch paths only).
fast-json-ingest = ["sonic-rs"]
