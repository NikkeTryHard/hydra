[package]
name = "hydra-model"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Neural model components for Hydra Riichi Mahjong AI"
repository = "https://github.com/hydra-mahjong/hydra"

build = "build.rs"
[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
hydra-core = { path = "../hydra-core" }
hydra-train-types = { path = "../hydra-train-types" }
burn = { version = "0.21", default-features = false, features = ["std"] }
libloading = "0.8"
safetensors = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-20", "cuda"] }
ndarray = "0.17"
sha2 = "0.10"

[dev-dependencies]
burn = { version = "0.21", default-features = false, features = ["std", "autodiff", "ndarray"] }


[build-dependencies]
cc = "1"

[features]
default = []
burn-cuda = ["burn/cuda", "burn/train"]
libtorch-tests = []
