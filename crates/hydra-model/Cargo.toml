[package]
name = "hydra-model"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Neural model components for Hydra Riichi Mahjong AI"
repository = "https://github.com/hydra-mahjong/hydra"

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
hydra-core = { path = "../hydra-core" }
hydra-train-types = { path = "../hydra-train-types" }
burn = { version = "0.20", default-features = false, features = ["std"] }

[dev-dependencies]
burn = { version = "0.20", features = ["autodiff", "ndarray", "tch"] }
