[package]
name = "hydra-model"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Neural model components for Hydra Riichi Mahjong AI"
repository = "https://github.com/hydra-mahjong/hydra"

build = "build.rs"
[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
hydra-core = { path = "../hydra-core" }
hydra-train-types = { path = "../hydra-train-types" }
burn = { version = "0.21", default-features = false, features = ["std"] }
tch = { version = "0.22", optional = true }
torch-sys = { version = "0.22", optional = true }
libloading = "0.8"

[dev-dependencies]
burn = { version = "0.21", default-features = false, features = ["std", "autodiff", "ndarray"] }


[build-dependencies]
cc = "1"

[features]
default = []
libtorch = ["burn/tch", "dep:tch", "dep:torch-sys"]
libtorch-tests = ["libtorch"]
