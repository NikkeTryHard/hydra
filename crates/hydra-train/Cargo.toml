[package]
name = "hydra-train"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Hydra Riichi Mahjong AI - training pipeline (SE-ResNet, ACH, ExIt)"
repository = "https://github.com/hydra-mahjong/hydra"

build = "build.rs"

[lints]
workspace = true
[lib]
crate-type = ["rlib"]

[[bin]]
name = "train"
path = "src/bin/train.rs"
required-features = ["training"]

[[bin]]
name = "mjai_audit"
path = "src/bin/mjai_audit.rs"
required-features = ["training"]

[[bin]]
name = "recompress"
path = "src/bin/recompress.rs"

[[bin]]
name = "repack_tar"
path = "src/bin/repack_tar.rs"

[[bin]]
name = "build_bc_shards"
path = "src/bin/build_bc_shards.rs"
required-features = ["training"]

[[bin]]
name = "build_parsed_sample_cache"
path = "src/bin/build_parsed_sample_cache.rs"

[[bin]]
name = "build_replay_exit_sidecar"
path = "src/bin/build_replay_exit_sidecar.rs"
required-features = ["training"]

[[bin]]
name = "build_replay_delta_q_sidecar"
path = "src/bin/build_replay_delta_q_sidecar.rs"
required-features = ["training"]

[dependencies]
hydra-core = { path = "../hydra-core" }
hydra-data-core = { path = "../hydra-data-core" }
hydra-replay-sidecar = { path = "../hydra-replay-sidecar" }
hydra-replay-loader = { path = "../hydra-replay-loader" }
hydra-sample-cache = { path = "../hydra-sample-cache" }
hydra-bc-shards = { path = "../hydra-bc-shards" }
hydra-train-algo = { path = "../hydra-train-algo" }
hydra-model = { path = "../hydra-model", default-features = false, optional = true }
hydra-train-types = { path = "../hydra-train-types" }
hydra-train-runtime = { path = "../hydra-train-runtime" }
hydra-train-exec = { path = "../hydra-train-exec", default-features = false, optional = true }
hydra-selfplay = { path = "../hydra-selfplay", default-features = false, optional = true }
hydra-search-labels = { path = "../hydra-search-labels", default-features = false, optional = true }
burn = { version = "0.21", default-features = false, features = ["std"], optional = true }
serde = { version = "1.0", features = ["derive"] }
dashmap = "6.1.0"
flate2 = { version = "1.1.9", features = ["zlib-rs"], default-features = false }
serde_json = "1.0.149"
serde_yaml = "0.9"
riichienv-core = { version = "0.4.7", path = "../hydra-engine", package = "hydra-engine", features = ["fast-json-ingest"] }
rayon = "1.10"
indicatif = "0.17"
half = "2.4"
memmap2 = "0.9"
tboard = "0.1.1"
colored = "3"
tar = "0.4"
zstd = "0.13"
ctrlc = "3.4"
time = { version = "0.3", features = ["formatting"] }
tch = { version = "0.22", optional = true }
torch-sys = { version = "0.22", optional = true }

[dev-dependencies]
burn = { version = "0.21", default-features = false, features = ["std", "ndarray"] }
rand = "0.9"
rand_chacha = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
hydra-train-runtime = { path = "../hydra-train-runtime" }

[features]
default = []
data-tools = []
training = [
    "dep:hydra-train-exec",
    "dep:hydra-selfplay",
    "dep:hydra-search-labels",
    "dep:hydra-model",
    "dep:burn",
    "burn/train",
    "burn/tch",
    "dep:tch",
    "dep:torch-sys",
    "hydra-train-exec/libtorch",
    "hydra-search-labels/model-eval",
]
cuda-graph = ["training", "hydra-train-exec/cuda-graph"]
test-nvtx-recorder = ["hydra-train-exec/test-nvtx-recorder"]


[[bench]]
name = "train_hotpaths_bench"
harness = false
required-features = ["training"]
