[package]
name = "hydra-train"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Hydra Riichi Mahjong AI - training pipeline (SE-ResNet, ACH, ExIt)"
repository = "https://github.com/hydra-mahjong/hydra"


[lints]
workspace = true
[lib]
crate-type = ["rlib"]

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "mjai_audit"
path = "src/bin/mjai_audit.rs"

[[bin]]
name = "recompress"
path = "src/bin/recompress.rs"

[[bin]]
name = "repack_tar"
path = "src/bin/repack_tar.rs"

[[bin]]
name = "build_bc_shards"
path = "src/bin/build_bc_shards.rs"

[[bin]]
name = "build_parsed_sample_cache"
path = "src/bin/build_parsed_sample_cache.rs"

[dependencies]
hydra-core = { path = "../hydra-core" }
hydra-data-core = { path = "../hydra-data-core" }
hydra-replay-sidecar = { path = "../hydra-replay-sidecar" }
hydra-replay-loader = { path = "../hydra-replay-loader" }
hydra-sample-cache = { path = "../hydra-sample-cache" }
hydra-bc-shards = { path = "../hydra-bc-shards" }
hydra-train-algo = { path = "../hydra-train-algo" }
hydra-model = { path = "../hydra-model" }
hydra-train-types = { path = "../hydra-train-types" }
hydra-train-runtime = { path = "../hydra-train-runtime" }
hydra-train-exec = { path = "../hydra-train-exec" }
hydra-selfplay = { path = "../hydra-selfplay" }
hydra-search-labels = { path = "../hydra-search-labels" }
burn = { version = "0.20", features = ["train", "tch"] }
serde = { version = "1.0", features = ["derive"] }
dashmap = "6.1.0"
flate2 = { version = "1.1.9", features = ["zlib-rs"], default-features = false }
serde_json = "1.0.149"
serde_yaml = "0.9"
riichienv-core = { version = "0.4.7", path = "../hydra-engine", package = "hydra-engine", features = ["fast-json-ingest"] }
rayon = "1.10"
indicatif = "0.17"
half = "2.4"
memmap2 = "0.9"
tboard = "0.1.1"
colored = "3"
tar = "0.4"
zstd = "0.13"
ctrlc = "3.4"
time = { version = "0.3", features = ["formatting"] }
libloading = "0.8"
tch = "0.22"
torch-sys = "0.22"

[dev-dependencies]
burn = { version = "0.20", features = ["ndarray"] }
rand = "0.9"
rand_chacha = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
hydra-train-runtime = { path = "../hydra-train-runtime", features = ["test-nvtx-recorder"] }

[features]
cuda-graph = ["hydra-train-exec/cuda-graph"]

[build-dependencies]
cc = "1"

[[bench]]
name = "train_hotpaths_bench"
harness = false
