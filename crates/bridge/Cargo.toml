# --- minimal-python identity (executed): single cdylib, single name ---
# Package `hydra-bridge`, `[lib] name = "_native"`, installed by maturin as
# the `hydra2._native` submodule (`[tool.maturin] module-name =
# "hydra2._native"`, `manifest-path = "crates/bridge/Cargo.toml"` in the
# workspace-root `pyproject.toml`). No `hydra2_replay_rs` re-export shim:
# the old name died atomically with its import sites. `extension-module`
# stays REMOVED (deprecated since maturin 1.9.4) and `auto-initialize` stays
# off (embedding-only; extensions must not enable it). Wheels are
# version-specific cp312 first (`requires-python >=3.12,<3.13`); abi3 only
# with a second interpreter as a separate explicit build. Ground truth:
# the `minimal-python` plan (`local://minimal-python-plan.md`).

[package]
name = "hydra-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
hydra-feed = { path = "../feed" }
hydra-shard = { path = "../shard" }
hydra-search = { path = "../search" }
# batch_canonical_bytes stages structured Python objects to serde Values (feed owns JCS emit).
serde_json = "1.0"
sha2 = "=0.11"
pyo3 = { version = "0.29.2", features = [] }
# M2 mirror REST transport (dep-add APPROVED — locked-goal ledger entry lives
# with the MirrorREST slice yield: observer-only reqwest, blocking + json +
# rustls-tls, timeout 5s, retries 0; every transport failure returns false so
# Python keeps its warn-only + file-fallback shape. Pinned exact.).
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
arrow-array = { version = "=59.3.0", features = ["ffi"] }
arrow-schema = { version = "=59.3.0", features = ["ffi"] }

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
