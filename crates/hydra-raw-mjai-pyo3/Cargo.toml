[package]
name = "hydra-raw-mjai-pyo3"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "PyO3 extension for raw MJAI pinned host batch fill"
repository = "https://github.com/hydra-mahjong/hydra"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "hydra_raw_mjai_pyo3"

[dependencies]
hydra-core = { path = "../hydra-core" }
hydra-train-exec = { path = "../hydra-train-exec" }
hydra-model = { path = "../hydra-model", default-features = false }
riichienv-core = { path = "../hydra-engine", package = "hydra-engine" }
rand = "0.9"
rayon = "1.10"
pyo3 = { version = "0.28.3", features = ["extension-module"] }
