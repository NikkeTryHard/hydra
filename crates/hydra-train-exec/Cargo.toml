[package]
name = "hydra-train-exec"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Hydra training execution composition layer"
repository = "https://github.com/hydra-mahjong/hydra"

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
hydra-train-runtime = { path = "../hydra-train-runtime" }
hydra-model = { path = "../hydra-model", default-features = false }
hydra-replay-loader = { path = "../hydra-replay-loader" }
hydra-bc-shards = { path = "../hydra-bc-shards" }
hydra-data-core = { path = "../hydra-data-core" }
hydra-core = { path = "../hydra-core" }
hydra-sample-cache = { path = "../hydra-sample-cache" }
hydra-train-types = { path = "../hydra-train-types" }
hydra-train-algo = { path = "../hydra-train-algo" }
hydra-replay-sidecar = { path = "../hydra-replay-sidecar" }
hydra-search-labels = { path = "../hydra-search-labels", default-features = false }
hydra-selfplay = { path = "../hydra-selfplay", default-features = false }
burn = { version = "0.21", default-features = false, features = ["std"] }
tch = { version = "0.22", optional = true }
torch-sys = { version = "0.22", optional = true }
colored = "3"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting"] }
ctrlc = "3.4"
rayon = "1.10"
tar = "0.4"
zstd = "0.13"
tboard = "0.1.1"
libloading = "0.8"

[dev-dependencies]
burn = { version = "0.21", default-features = false, features = ["std", "ndarray"] }

[build-dependencies]
cc = "1"


[features]
default = []
libtorch = [
    "burn/train",
    "burn/tch",
    "dep:tch",
    "dep:torch-sys",
    "hydra-search-labels/model-eval",
]
cuda-graph = ["libtorch"]
bootstrap-exec-in-progress = []
rl-runner-exec-in-progress = []
test-nvtx-recorder = []
