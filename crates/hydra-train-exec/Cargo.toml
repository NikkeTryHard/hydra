[package]
name = "hydra-train-exec"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Hydra training execution composition layer"
repository = "https://github.com/hydra-mahjong/hydra"

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
hydra-train-runtime = { path = "../hydra-train-runtime" }
hydra-model = { path = "../hydra-model" }
hydra-replay-loader = { path = "../hydra-replay-loader" }
hydra-bc-shards = { path = "../hydra-bc-shards" }
hydra-data-core = { path = "../hydra-data-core" }
hydra-core = { path = "../hydra-core" }
hydra-sample-cache = { path = "../hydra-sample-cache" }
hydra-train-types = { path = "../hydra-train-types" }
hydra-train-algo = { path = "../hydra-train-algo" }
hydra-replay-sidecar = { path = "../hydra-replay-sidecar" }
hydra-search-labels = { path = "../hydra-search-labels" }
hydra-selfplay = { path = "../hydra-selfplay" }
burn = { version = "0.20", features = ["train"] }
colored = "3"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting"] }
ctrlc = "3.4"
rayon = "1.10"
tar = "0.4"
zstd = "0.13"
tboard = "0.1.1"


[features]
bootstrap-exec-in-progress = []
rl-runner-exec-in-progress = []
cuda-graph = []
