[package]
name = "hydra-selfplay"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Hydra self-play coordination primitives"
repository = "https://github.com/hydra-mahjong/hydra"

[lints]
workspace = true

[dependencies]
hydra-core = { path = "../hydra-core" }
hydra-train-types = { path = "../hydra-train-types" }
hydra-model = { path = "../hydra-model", default-features = false }
hydra-train-algo = { path = "../hydra-train-algo", default-features = false }
hydra-search-labels = { path = "../hydra-search-labels", default-features = false }
burn = { version = "0.21", default-features = false, features = ["std"] }
riichienv-core = { version = "0.4.7", path = "../hydra-engine", package = "hydra-engine", features = ["fast-json-ingest"] }

[dev-dependencies]
burn = { version = "0.21", default-features = false, features = ["std", "autodiff", "ndarray"] }

[features]
default = []
model-eval = ["hydra-search-labels/model-eval"]
